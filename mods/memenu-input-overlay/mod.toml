# A first-party mod: part of the menu, written against the public API only (native, C++). It ships inside the menu's
# DLL and is written to memenu\mods\memenu-input-overlay at startup: edit a copy under another id, not this folder.
# Layouts: the .json files in input_layouts\ next to this file (the built-in ones are written there the first time).
id = "memenu-input-overlay"
name = "Input Overlay"
version = "1.0.0"
description = "The keyboard and mouse on screen, like NohBoard (also a TAS macro's input)"
authors = ["Mirror's Edge Menu"]
mirage = "^0.1"
entry = "memenu-input-overlay.dll"

[settings.layout]
type = "string"
name = "Layout name"
module = "Input Overlay"
description = "Picked in the list below"
default = "Movement"

[settings.section_layout]
type = "bool"
name = "Layout"
module = "Input Overlay"
default = true

[settings.show_when]
type = "choice"
name = "Show"
module = "Input Overlay"
description = "During a TAS it shows the macro's input: what it presses, frame by frame"
options = ["Always", "Not during a TAS", "Only during a TAS"]
default = "Always"

[settings.section_look]
type = "bool"
name = "Look"
module = "Input Overlay"
default = false

[settings.key_size]
type = "int"
name = "Key size"
module = "Input Overlay"
default = 36
min = 16
max = 96
format = "%d px"

[settings.spacing]
type = "int"
name = "Spacing"
module = "Input Overlay"
default = 4
min = 0
max = 16
format = "%d px"

[settings.rounding]
type = "int"
name = "Rounding"
module = "Input Overlay"
default = 5
min = 0
max = 20
format = "%d px"

[settings.outline]
type = "float"
name = "Outline"
module = "Input Overlay"
default = 1.0
min = 0.0
max = 4.0
format = "%.1f px"

[settings.text_size]
type = "int"
name = "Text size"
module = "Input Overlay"
description = "0 = from the key size"
default = 0
min = 0
max = 48
format = "%d px"

[settings.fade]
type = "int"
name = "Fade"
module = "Input Overlay"
description = "How long a key takes to go dark after it is let go"
default = 90
min = 0
max = 500
format = "%d ms"

[settings.backdrop]
type = "float"
name = "Backdrop"
module = "Input Overlay"
description = "The window's background behind the keys"
default = 0.0
min = 0.0
max = 1.0
format = "%.2f"

[settings.section_colors]
type = "bool"
name = "Colors"
module = "Input Overlay"
default = false

[settings.key_color]
type = "color"
name = "Key"
module = "Input Overlay"
default = "#141419B8"

[settings.pressed_color]
type = "color"
name = "Pressed"
module = "Input Overlay"
default = "#EDEDF2F2"

[settings.text_color]
type = "color"
name = "Text"
module = "Input Overlay"
default = "#D9D9E0FF"

[settings.pressed_text_color]
type = "color"
name = "Pressed text"
module = "Input Overlay"
default = "#0F0F14FF"

[settings.outline_color]
type = "color"
name = "Outline color"
module = "Input Overlay"
default = "#FFFFFF2E"

[settings.section_extras]
type = "bool"
name = "Extras"
module = "Input Overlay"
default = false

[settings.counts]
type = "bool"
name = "Press counts"
module = "Input Overlay"
description = "How many times each key was pressed, under its name"
default = false

[settings.mouse_scale]
type = "float"
name = "Mouse pad sensitivity"
module = "Input Overlay"
default = 1.0
min = 0.1
max = 5.0
format = "%.1fx"

[settings.mouse_trail]
type = "bool"
name = "Mouse pad line"
module = "Input Overlay"
description = "A line from the middle to the dot"
default = true

[settings.invert_y]
type = "bool"
name = "Invert mouse pad Y"
module = "Input Overlay"
default = false
