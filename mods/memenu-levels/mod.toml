# A first-party mod: part of the menu, written against the public API only (Lua). It ships inside the menu's DLL and
# is written to memenu\mods\memenu-levels at startup: edit a copy under another id, not this folder.
id = "memenu-levels"
name = "Levels"
version = "1.1.0"
description = "The menu's level features as a Lua mod: the level loader, Sublevels, Restart Checkpoint, Main Menu"

[settings.load_options]
type = "bool"
name = "Load options"
module = "Levels"
description = "Show how levels are loaded"
default = false

[settings.console_load]
type = "bool"
name = "Console load"
module = "Levels"
description = "Use the console command 'open <map>' instead of the game's StartGame. Ignores checkpoints"
default = false

[settings.save_progress]
type = "bool"
name = "Save progress"
module = "Levels"
description = "Let loads made here overwrite your saved checkpoint progress"
default = true
authors = ["Mirror's Edge Menu"]
mirage = "^0.1"
