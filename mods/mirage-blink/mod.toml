  # A first-party mod: part of the menu, written against the public API only (Lua). It ships inside the menu's DLL and
# is written to mirage\mods\mirage-blink at startup: edit a copy under another id, not this folder. See main.lua.
id = "mirage-blink"
name = "Blink"
version = "1.1.0"
description = "Hold to aim a short teleport, let go to cross to it at 100 m/s: onto floors, up ledges, through the air"
authors = ["Mirage"]
mirage = "^0.1"

# content/animations: the first-person arm's three clips (runtime/anim.h, "Custom animations"): BlinkAim (held up while
# aiming, looping), BlinkCast (driven forward on letting go) and BlinkLand (dropped back on arriving). They hold only
# rotations of the left arm, hand and fingers; everything else is the game's own Stand pose (each clip's "base").
# shaders/blink.hlsl is the lens pass (render/postfx.h). No sounds ship: sounds/charge.wav and sounds/release.wav are
# played when they are in the installed mod's folder.
content = ["content"]

[actions.blink]
key = "F"
description = "Hold to aim; let go to blink to the marker"

[actions.cancel]
key = "RightMouseButton"
description = "While aiming: put the blink away without using it"

[settings.tier]
type = "choice"
name = "Tier"
description = "How far a blink reaches looking level or down: I 11 m, II 16 m (looking up it rises 5 m at most)"
options = ["I", "II"]
default = "I"

[settings.ledge]
type = "float"
name = "Ledge reach"
description = "How far above a spot against a wall a blink still finds a top to mantle onto (100 units a metre)"
default = 160.0
min = 0.0
max = 400.0
format = "%.0f"

[settings.cooldown]
type = "float"
name = "Cooldown"
description = "Seconds after a blink before the next one"
default = 1.0
min = 0.0
max = 5.0
format = "%.2f"

[settings.fov_kick]
type = "float"
name = "View kick"
description = "Degrees the view widens during a blink (0: none)"
default = 14.0
min = 0.0
max = 40.0
format = "%.0f"

[settings.volume]
type = "float"
name = "Volume"
description = "How loud the blink's sounds are (sounds/charge.wav and sounds/release.wav in the mod's folder)"
default = 0.8
min = 0.0
max = 1.0
format = "%.2f"
