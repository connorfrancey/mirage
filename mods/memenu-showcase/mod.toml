# A first-party mod: part of the menu, written against the public API only (Lua). It ships inside the menu's DLL and
# is written to memenu\mods\memenu-showcase at startup: edit a copy under another id, not this folder.
#
# The Mirage Showcase: one window that shows what the loader lets a mod do, live, each part with the API it uses.
id = "memenu-showcase"
name = "Mirage Showcase"
version = "1.0.0"
description = "A tour of the mod loader: live objects, writes, events, hooks, script injection, a class made in Lua"
authors = ["Mirror's Edge Menu"]
mirage = "^0.1"

[settings.low_gravity]
type = "bool"
name = "Low gravity"
module = "Mirage Showcase"
description = "Writes the level's gravity (WorldInfo.WorldGravityZ); put back when off"
default = false

[settings.gravity_scale]
type = "float"
name = "Gravity scale"
module = "Mirage Showcase"
description = "The level's own gravity times this, while Low gravity is on"
default = 0.35
min = 0.1
max = 1.0
format = "%.2f"

[settings.weighted_jumps]
type = "bool"
name = "Weighted jumps"
module = "Mirage Showcase"
description = "Script injection into TdMove_Jump.StartMove: jumps as if carrying a heavy weapon"
default = false

[settings.pad_strength]
type = "float"
name = "Pad strength"
module = "Mirage Showcase"
description = "How hard the showcase's bounce pads launch you (their class is defined in Lua)"
default = 1500.0
min = 600.0
max = 4000.0
format = "%.0f"

[settings.spawn_pad]
type = "bool"
name = "Drop a pad"
module = "Mirage Showcase"
description = "Drops a bounce pad where you stand (switches itself back off)"
default = false
