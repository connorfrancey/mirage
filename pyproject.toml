# Developer tooling for the project (not part of the mod itself).
#
#   uv sync                 create .venv and install the `mirage` command into it
#   uv run mirage --help    build, test, install into the game, package, ...

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-tools"
version = "0.1.0"
description = "Build, test, install and package Mirage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "loguru>=0.8.0",
    "numpy>=2.4.6",
    "orjson>=3.13.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pygltflib>=1.16.5",
    "pymeow>=1.0.1",
    "pyooz>=0.0.8",
    "pyqt6>=6.12.1",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "questionary>=2.1.1",
    "rich>=13.7",
    "sarge>=0.1.8",
    "sqlalchemy>=2.1.9",
    "ttf-opensans>=2020.10.30",
    "unreal-stylesheet>=0.0.4",
    "zstandard>=0.23; python_version < '3.14'",   # Archived logs (logs/.old/*.log.zst); 3.14+ has compression.zstd
]

[project.scripts]
mirage = "mirage_tools.cli:main"
mirage-apigen = "mirage_apigen.cli:api"

[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]
